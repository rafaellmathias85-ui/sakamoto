name: Build and deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    env:
      NEXTAUTH_URL: https://odontosakamoto.com.br
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ABACUSAI_API_KEY: ${{ secrets.ABACUSAI_API_KEY }}
      WEB_APP_ID: ${{ secrets.WEB_APP_ID }}
      NOTIF_ID_AGENDAMENTO_DE_CONSULTA: ${{ secrets.NOTIF_ID_AGENDAMENTO_DE_CONSULTA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/odontosaka/sakamoto' }}
      NEXTAUTH_URL: https://odontosakamoto.com.br
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ABACUSAI_API_KEY: ${{ secrets.ABACUSAI_API_KEY }}
      WEB_APP_ID: ${{ secrets.WEB_APP_ID }}
      NOTIF_ID_AGENDAMENTO_DE_CONSULTA: ${{ secrets.NOTIF_ID_AGENDAMENTO_DE_CONSULTA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to app directory
        run: |
          mkdir -p "$DEPLOY_PATH"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'nextjs_space/.env' \
            --exclude 'nextjs_space/.next' \
            --exclude 'nextjs_space/node_modules' \
            ./ "$DEPLOY_PATH/"

      - name: Write production environment
        run: |
          cat > "$DEPLOY_PATH/nextjs_space/.env" <<EOF
          NODE_ENV=production
          PORT=3000
          NEXTAUTH_URL=$NEXTAUTH_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          DATABASE_URL=$DATABASE_URL
          ABACUSAI_API_KEY=$ABACUSAI_API_KEY
          WEB_APP_ID=$WEB_APP_ID
          NOTIF_ID_AGENDAMENTO_DE_CONSULTA=$NOTIF_ID_AGENDAMENTO_DE_CONSULTA
          EOF

      - name: Install, build and restart app
        run: |
          set -e
          cd "$DEPLOY_PATH/nextjs_space"
          npm ci --legacy-peer-deps
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart odontologia-sakamoto || PORT=3000 pm2 start npm --name odontologia-sakamoto -- start
            pm2 save
          else
            echo 'PM2 nao encontrado. Instale PM2 na hospedagem para manter o Next.js rodando.'
            exit 1
          fi
