name: Deploy hospedagem

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-odontologia-sakamoto
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/odontosaka/sakamoto' }}
      NEXTAUTH_URL: https://odontosakamoto.com.br
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: "3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to app directory
        run: |
          set -e
          mkdir -p "$DEPLOY_PATH"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'nextjs_space/.env' \
            --exclude 'nextjs_space/.next' \
            --exclude 'nextjs_space/node_modules' \
            ./ "$DEPLOY_PATH/"

      - name: Write production environment
        run: |
          set -e
          cat > "$DEPLOY_PATH/nextjs_space/.env" <<EOF
          NODE_ENV=production
          PORT=$PORT
          NEXTAUTH_URL=$NEXTAUTH_URL
          DATABASE_URL=$DATABASE_URL
          EOF

      - name: Install dependencies
        working-directory: ${{ env.DEPLOY_PATH }}/nextjs_space
        run: npm ci --legacy-peer-deps

      - name: Prepare database
        working-directory: ${{ env.DEPLOY_PATH }}/nextjs_space
        run: |
          npx prisma generate
          npx prisma db push

      - name: Build app
        working-directory: ${{ env.DEPLOY_PATH }}/nextjs_space
        run: npm run build

      - name: Restart app with PM2
        working-directory: ${{ env.DEPLOY_PATH }}/nextjs_space
        run: |
          set -e
          if command -v pm2 >/dev/null 2>&1; then
            PM2_CMD="pm2"
          else
            npm install --prefix "$DEPLOY_PATH/.pm2-bin" pm2
            PM2_CMD="$DEPLOY_PATH/.pm2-bin/node_modules/.bin/pm2"
          fi

          PORT="$PORT" "$PM2_CMD" restart odontologia-sakamoto || PORT="$PORT" "$PM2_CMD" start npm --name odontologia-sakamoto -- start
          "$PM2_CMD" save || true
          "$PM2_CMD" status
